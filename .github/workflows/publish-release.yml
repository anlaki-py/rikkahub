name: Publish release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          latest_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No semantic release tag found." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<EOF
          $latest_tag
          EOF
          next_version="$major.$minor.$((patch + 1))"

          base_version_code="$(sed -n 's/^val defaultVersionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)"
          if [ -z "$base_version_code" ]; then
            echo "Could not read the base version code from app/build.gradle.kts." >&2
            exit 1
          fi

          echo "name=$next_version" >> "$GITHUB_OUTPUT"
          echo "code=$((base_version_code + RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Prepare signing and service files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret." >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret." >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret." >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret." >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/app.key
          cat > local.properties <<EOF
          storeFile=app/app.key
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="$(find app/build/outputs/apk/github/release -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$apk" || { echo "arm64 APK was not produced." >&2; exit 1; }
          cp "$apk" "RikkaHub-$VERSION-arm64-v8a.apk"
          cp app/build/outputs/mapping/githubRelease/mapping.txt "mapping-$VERSION.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$VERSION" \
            "RikkaHub-$VERSION-arm64-v8a.apk" \
            "mapping-$VERSION.txt" \
            --title "$VERSION" \
            --generate-notes
